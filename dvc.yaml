---
stages:
  build_wf_yolo_dataset:
    cmd: >-
      uv run python scripts/build_wf_yolo_dataset.py
      --registry data/raw/wildfire/registry.json
      --data-dir data/raw/wildfire/data
      --output data/processed/wildfire_yolo
      --max-per-seq 10
      --random-seed 0
    deps:
      - scripts/build_wf_yolo_dataset.py
      - data/raw/wildfire/registry.json
      - data/raw/wildfire/data
    outs:
      - data/processed/wildfire_yolo

  compute_fp_embeddings:
    cmd: >-
      uv run python scripts/embed_fp_for_selection.py
      --registry data/raw/fp/registry.json
      --data-dir data/raw/fp/data
      --output data/interim/fp_sequence_embeddings
      --splits val train test
    deps:
      - scripts/embed_fp_for_selection.py
      - src/pyro_dataset/fp/selection.py
      - data/raw/fp/registry.json
      - data/raw/fp/data
    outs:
      - data/interim/fp_sequence_embeddings/val
      - data/interim/fp_sequence_embeddings/train
      - data/interim/fp_sequence_embeddings/test

  build_fp_yolo_dataset:
    cmd: >-
      uv run python scripts/build_fp_yolo_dataset.py
      --registry data/raw/fp/registry.json
      --data-dir data/raw/fp/data
      --wf-dataset data/processed/wildfire_yolo
      --embeddings-dir data/interim/fp_sequence_embeddings
      --recurring-objects data/raw/pyro-annotator/recurring_objects.json
      --output data/processed/fp_yolo
      --random-seed 0
    deps:
      - scripts/build_fp_yolo_dataset.py
      - src/pyro_dataset/fp/selection.py
      - data/raw/fp/registry.json
      - data/raw/fp/data
      - data/raw/pyro-annotator/recurring_objects.json
      - data/processed/wildfire_yolo
      - data/interim/fp_sequence_embeddings/val
      - data/interim/fp_sequence_embeddings/train
    outs:
      - data/processed/fp_yolo

  merge_yolo_dataset:
    cmd: >-
      uv run python scripts/merge_yolo_dataset.py
      --wf-dataset data/processed/wildfire_yolo
      --fp-dataset data/processed/fp_yolo
      --output-train-val data/processed/yolo_train_val
      --output-test data/processed/yolo_test
    deps:
      - scripts/merge_yolo_dataset.py
      - data/processed/wildfire_yolo
      - data/processed/fp_yolo
    outs:
      - data/processed/yolo_train_val
      - data/processed/yolo_test:
          remote: awspyronear-private

  build_sequential_dataset:
    cmd: >-
      uv run python scripts/build_sequential_dataset.py
      --wf-registry data/raw/wildfire/registry.json
      --wf-data-dir data/raw/wildfire/data
      --fp-registry data/raw/fp/registry.json
      --fp-data-dir data/raw/fp/data
      --embeddings-dir data/interim/fp_sequence_embeddings
      --output-train-val data/processed/sequential_train_val
      --output-test data/processed/sequential_test
      --test-lockfile data/raw/sequential_test_lock.json
      --random-seed 0
    deps:
      - scripts/build_sequential_dataset.py
      - src/pyro_dataset/fp/selection.py
      - src/pyro_dataset/fp/lockfile.py
      - data/raw/wildfire/registry.json
      - data/raw/wildfire/data
      - data/raw/fp/registry.json
      - data/raw/fp/data
      - data/interim/fp_sequence_embeddings/val
      - data/interim/fp_sequence_embeddings/train
      - data/raw/sequential_test_lock.json
    outs:
      - data/processed/sequential_train_val
      - data/processed/sequential_test:
          remote: awspyronear-private

  test_data_leakage:
    cmd: >-
      uv run pytest tests/test_data_leakage.py -v
      --junit-xml=data/reporting/leakage_results.xml
    deps:
      - tests/test_data_leakage.py
      - data/processed/wildfire_yolo
      - data/processed/yolo_train_val
      - data/processed/yolo_test
      - data/processed/sequential_train_val
      - data/processed/sequential_test
      - data/raw/pyro-annotator/recurring_objects.json
      - data/raw/wildfire/registry.json
      - data/raw/fp/registry.json
      - data/raw/sequential_test_lock.json

  build_toy_dataset:
    cmd: >-
      uv run python scripts/build_toy_dataset.py
      --yolo-src data/processed/yolo_train_val
      --seq-src data/processed/sequential_train_val
      --yolo-output data/processed/yolo_toy
      --seq-output data/processed/sequential_toy
      --ratio 0.05
      --random-seed 0
    deps:
      - scripts/build_toy_dataset.py
      - data/processed/yolo_train_val
      - data/processed/sequential_train_val
    outs:
      - data/processed/yolo_toy
      - data/processed/sequential_toy

  visualize_yolo_train_val:
    cmd: >-
      uv run python scripts/visualize_dataset.py
      --dir-dataset data/processed/yolo_train_val
      --dir-save data/reporting/viz/yolo_train_val
    deps:
      - scripts/visualize_dataset.py
      - data/processed/yolo_train_val
    outs:
      - data/reporting/viz/yolo_train_val

  visualize_yolo_test:
    cmd: >-
      uv run python scripts/visualize_dataset.py
      --dir-dataset data/processed/yolo_test
      --dir-save data/reporting/viz/yolo_test
    deps:
      - scripts/visualize_dataset.py
      - data/processed/yolo_test
    outs:
      - data/reporting/viz/yolo_test

  # Copies the alerts scripts/plan_annotator_import.py decided on into staging
  # folders. The planning half stays a manual command: it carries the
  # recurring-object ledger, which is accumulated state a stage would rebuild.
  #
  # Last on purpose. Nothing downstream consumes its output — add_data.py does,
  # by hand — and it is the only stage needing the 2.2 GB annotator export, so
  # running it first would make every other stage hostage to that pull.
  materialise_annotator_sequences:
    cmd: >-
      uv run python scripts/materialise_annotator_sequences.py
      --export-dir data/raw/pyro-annotator/export
      --plan data/raw/pyro-annotator/import_plan.json
      --output-dir data/interim/pyro-annotator/sequences
    deps:
      - scripts/materialise_annotator_sequences.py
      - src/pyro_dataset/annotator/convert.py
      - src/pyro_dataset/constants.py
      - data/raw/pyro-annotator/export
      - data/raw/pyro-annotator/import_plan.json
    outs:
      - data/interim/pyro-annotator/sequences
