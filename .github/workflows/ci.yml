name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev --group test

      # `tests/test_data_leakage.py` skips itself when `data/processed/` is
      # absent, which it always is here — the datasets are DVC-tracked and CI
      # has no access to them. Everything else runs on fixtures and `tmp_path`.
      #
      # `--no-sync`: without it `uv run` re-syncs to the default groups and
      # reinstalls the dev group the step above just excluded.
      - name: Run tests
        run: uv run --no-sync pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev --group lint

      # `no-commit-to-branch` guards local commits. On a push to `main`,
      # actions/checkout puts HEAD on a local `main`, so the hook would fail the
      # job for doing exactly what the event is — skip it here.
      #
      # `--show-diff-on-failure`: the fixing hooks report only "files were
      # modified by this hook", which is useless from a log. The diff is the fix.
      #
      # `--no-sync`: without it `uv run` re-syncs to the default groups and
      # reinstalls the dev group the step above just excluded.
      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  check-leakage-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check leakage test results
        run: |
          python3 - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          path = "data/reporting/leakage_results.xml"
          try:
              tree = ET.parse(path)
          except FileNotFoundError:
              print(f"ERROR: {path} not found. Run `dvc repro test_data_leakage` and commit the result.")
              sys.exit(1)

          suite = tree.getroot()
          failures = int(suite.attrib.get("failures", 0))
          errors = int(suite.attrib.get("errors", 0))
          tests = int(suite.attrib.get("tests", 0))
          skipped = int(suite.attrib.get("skipped", 0))

          print(f"Tests: {tests}, Skipped: {skipped}, Failures: {failures}, Errors: {errors}")

          if failures or errors:
              for tc in suite.iter("testcase"):
                  for bad in list(tc.iter("failure")) + list(tc.iter("error")):
                      print(f"FAIL {tc.attrib.get('name')}: {bad.text}")
              sys.exit(1)

          print("All leakage tests passed.")
          EOF
